<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'DM Sans', Helvetica, Arial, sans-serif">
<title>Ingestion Workbench</title>
<desc>Two ingestion patterns. Large tables: one multi-terabyte source table is split into key ranges, read by many parallel queries, N at a time, on a job cluster, and written to one Delta table. Multi-tenant estates: thousands of tenant databases are checked for changes, only the changed ones are read by one job cluster, and every tenant's rows land in a few shared Delta tables, tagged by tenant.</desc>
